# 生产环境请按部署实际情况修改下列取值（优先用环境变量覆盖，勿把真实密钥提交进仓库）
server.port=8888

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# HTTPS 部署时建议：server.servlet.session.cookie.secure=true

spring.redis.host=${SPRING_REDIS_HOST:127.0.0.1}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.database=0
spring.redis.timeout=1800000
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-wait=-1
spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/yin_music?serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false&useUnicode=true&characterEncoding=utf8&autoReconnect=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# 必须通过环境变量 SPRING_DATASOURCE_PASSWORD 注入，避免仓库内明文口令
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket-name=${MINIO_BUCKET_NAME:}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:https://your-frontend.example.com}
app.security.login.max-failed-attempts=5
app.security.login.lock-minutes=10
# Legacy MD5 password salt (new passwords use BCrypt); override in production if needed
app.security.password-salt=${APP_SECURITY_PASSWORD_SALT:zyt}
# 生产关闭旧 MD5 口令校验；种子用户需先重置为 BCrypt
app.security.allow-legacy-md5=false

# 本地媒体根目录；生产建议改为绝对路径，例如 /var/yin-music/data
app.media.root=${APP_MEDIA_ROOT:data}

app.password-reset.mock-without-mail=false
app.password-reset.expose-code=false
app.password-reset.code-ttl-minutes=10
app.password-reset.send-cooldown-seconds=60

